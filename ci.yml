name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Pipeline smoke test (gate must block; benchmark must run)
        run: |
          python scripts/build_model_dataset.py
          python scripts/benchmark_estimator.py
          python scripts/train_synergy_model.py || test $? -eq 2
